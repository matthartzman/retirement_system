<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retirement Planner</title>
<link rel="stylesheet" href="/gateway/static/gateway.css">
<script src="/gateway/static/gateway.js" defer></script>
</head>
<body data-page="users">
<header class="top">
  <h1>Retirement Planner</h1>
  <nav aria-label="Main">
    <a href="/">Planner</a>
    <a href="/gateway/account">My account</a>
  </nav>
</header>
<main>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <section>
    <h2>Users</h2>
    <div class="bar"><button type="button" class="primary" id="add-user">Add person</button><span id="user-count" class="note"></span></div>
    <div class="wrap">
      <table>
        <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Two-factor</th><th>Last sign-in</th><th></th></tr></thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </section>
  <dialog id="user-dialog" aria-labelledby="dlg-title">
    <form id="user-form" novalidate>
      <header class="dhead">
        <h2 id="dlg-title">Add person</h2>
        <button type="submit" class="primary" id="u-save-top">Save changes</button>
        <div class="err" id="form-err" role="alert"></div>
      </header>
      <section class="acct">
        <h3>Account</h3>
        <div class="row2">
          <label class="field"><span>Name</span><input id="u-display" type="text" autocomplete="off"></label>
          <label class="field"><span>Username</span><input id="u-username" type="text" autocomplete="off" autocapitalize="none"></label>
        </div>
        <label class="field" id="u-temp-field"><span>Temporary password (12+ characters; they choose their own at first sign-in)</span><input id="u-temp" type="password" autocomplete="new-password"></label>
        <div class="row3">
          <label class="field"><span>Role</span><select id="u-role"><option value="user">User</option><option value="admin">Administrator</option></select></label>
          <label class="field"><span>Added</span><output id="u-added"></output></label>
        </div>
        <details class="acts" id="u-acts">
          <summary>Password, sessions and removal</summary>
          <label class="field"><span>New temporary password</span><input id="u-reset" type="password" autocomplete="new-password"></label>
          <div class="actions">
            <button type="button" data-act="reset-password">Reset password</button>
            <button type="button" data-act="reset-totp">Reset two-factor</button>
            <button type="button" data-act="unlock" id="u-unlock">Unlock</button>
            <button type="button" data-act="toggle" id="u-toggle">Disable</button>
            <button type="button" class="danger" data-act="delete">Delete</button>
          </div>
        </details>
      </section>
      <div class="foot"><button type="button" id="u-close">Close</button><button type="submit" class="primary" id="u-save">Save changes</button></div>
    </form>
  </dialog>
  <section>
    <h2>Audit log</h2>
    <div class="wrap">
      <table>
        <thead><tr><th>Time</th><th>Who</th><th>Event</th><th>Target</th><th>Details</th><th>Address</th></tr></thead>
        <tbody id="audit-body"></tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
