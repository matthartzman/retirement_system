<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retirement Planner</title>
<link rel="stylesheet" href="/gateway/static/gateway.css">
<script src="/gateway/static/gateway.js" defer></script>
</head>
<body data-page="enrol">
<header class="top"><h1>Retirement Planner</h1></header>
<main>
  <section>
    <h2>Set up two-factor sign-in</h2>
    <p>Two-factor authentication is required. Add this account to an authenticator app, then enter the 6-digit code it shows.</p>
    <p>Enter this key manually in your app:</p>
    <div id="secret" class="secret" aria-label="Setup key">Loading...</div>
    <p>Or open this link on a device with an authenticator app:
      <a id="uri" href="#">Authenticator link</a></p>
  </section>
  <form id="confirm-form" class="card">
    <label for="code">Code</label>
    <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
    <button type="submit">Confirm</button>
  </form>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
