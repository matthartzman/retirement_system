name: Nightly

# E2E/CI efficiency review (2026-09-15), recommendation R6. ci.yml's `test`
# job excludes tests marked `nightly` (pyproject.toml's marker doc explains
# why -- currently just test_all_modules_off_build_functional.py's 24-build
# single-module-off sweep) so push/PR CI isn't dominated by a sweep over a
# module registry that rarely changes. This workflow runs the FULL,
# unfiltered suite (no `-m` filter at all) on a daily schedule instead, so a
# regression that sweep alone would catch still surfaces within 24h -- just
# not on every push/PR. Add `workflow_dispatch` so a maintainer can also run
# it on demand (e.g. right after actually changing module_catalog.py,
# instead of waiting for the next scheduled run).
on:
  schedule:
    # 09:00 UTC daily. GitHub Actions cron triggers only fire from the
    # workflow file version on the default branch (main) -- editing this
    # schedule on a feature branch has no effect until it merges.
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  full-suite:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    # See ci.yml's own comment on this step -- same codemod tests need
    # node_modules present.
    - uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Install Node dependencies
      run: npm ci

    - name: Remove pytest-timeout plugin
      run: |
        pip uninstall -y pytest-timeout || true

    # No -m filter: this is the point of this workflow. -n auto still
    # parallelizes it the same way ci.yml's `test` job does.
    - name: Run full test suite (including nightly-only tests)
      shell: bash
      run: |
        pytest tests/ -n auto --tb=short -q --cov=src --cov-report=xml -v > /tmp/pytest_output.txt 2>&1 || TEST_EXIT=$?
        cat /tmp/pytest_output.txt
        exit ${TEST_EXIT:-0}

    - name: Fail if the test suite mutated input/
      run: git diff --exit-code -- input/
