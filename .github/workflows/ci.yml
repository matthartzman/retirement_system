name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'documentation/**'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'documentation/**'
      - 'docs/**'

# A force-push to a PR branch used to leave its previous ~90-minute run
# burning to a result nobody would read. Cancel any in-flight run for the
# same ref before starting a new one. Scoped per-ref (not per-workflow) so
# unrelated branches/PRs never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and reports in well under a minute: ruff, the source-text-only
  # test files (no src/ import -- line-count ratchets, string-presence and
  # doc-currency checks), and tools/run_regression.py's static assertions.
  # Motivation (2026-09-15 CI-time profiling, see documentation/reference/
  # TESTING_REFACTOR_RECOMMENDATIONS.md item 10): at least five recent
  # `Fix CI:` commits (RENT_FIRST, RENT_REST, the dashboard.js line ratchet
  # twice, sheet-tab-order fixtures) were failures of exactly this class,
  # each discovered only after an ~85-minute wait for the `test` job because
  # nothing ran these cheap checks first. `regression-checks` used to be its
  # own job whose 51s of setup dwarfed its own 4s of check time; folded in
  # here instead of paying that setup cost twice.
  fast-gates:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    # A handful of the source-text-only files below (test_dashboard_codemod_*,
    # test_dashboard_extract_module_tool, test_dashboard_js_module_bridge_*)
    # import no src/ code but still shell out to tools/js_codemod/*.mjs,
    # which needs node_modules (@babel/parser, jscodeshift) -- same
    # requirement as the `test` job below. Confirmed locally: omitting this
    # step makes those files fail here with ERR_MODULE_NOT_FOUND, not the
    # regression they're meant to catch.
    - uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Install Node dependencies
      run: npm ci

    - name: Lint with ruff
      run: |
        ruff check src/ tests/

    - name: Static source-text test files (no engine import)
      shell: bash
      run: |
        files=$(for f in tests/test_*.py; do
          if ! grep -qE "^\s*(import|from)\s+(src|numpy|openpyxl|scipy|matplotlib)" "$f"; then
            echo "$f"
          fi
        done)
        echo "$files" | tr '\n' ' '
        # -m "not slow": the file-selection heuristic above only looks at
        # imports, so it can still pick up a file that is otherwise static
        # but has one @pytest.mark.slow test requesting the built_workbook_*
        # fixture (confirmed locally: test_allocation_pie_labels_functional.py
        # cost 91s here before this filter was added, dwarfing the other 83
        # files combined). This mirrors the same exclusion the `test` job
        # applies.
        pytest $files -m "not slow and not nightly" --tb=short -q

    - name: Run regression checks (static analysis, not pytest)
      run: |
        python tools/run_regression.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: '3.14'

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    # Several pytest tests shell out to the tools/js_codemod/*.mjs codemods
    # (tests/test_dashboard_codemod_census_report_regression.py,
    # test_dashboard_extract_module_tool.py,
    # test_dashboard_js_module_bridge_regression.py). Those scripts import
    # @babel/parser and jscodeshift, so without node_modules they die with
    # ERR_MODULE_NOT_FOUND and the tests report it as tool failure/drift.
    - uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Install Node dependencies
      run: npm ci

    - name: Type check (mypy, informational — not yet a merge gate)
      run: mypy src/ --ignore-missing-imports || true

    # shell: bash is load-bearing, not stylistic. This job runs on
    # windows-latest, where the default shell is pwsh -- and every line below is
    # bash: `/tmp/...`, `|| TEST_EXIT=$?`, `${TEST_EXIT:-0}`, `grep`. Under pwsh
    # the redirect resolved to D:\tmp\pytest_output.txt, which does not exist, so
    # the step died with "Could not find a part of the path" BEFORE pytest ran.
    # The job then reported failure on every commit -- including docs-only ones
    # -- while executing zero tests, so a red CI here meant nothing at all.
    #
    # -n auto --dist loadfile: matches the full-suite command CLAUDE.md
    # already documents (measured 3.3x wall-clock speedup on 4 cores locally,
    # 2026-09-15). --dist loadfile keeps each file's tests on a single
    # worker so module-scoped fixtures stay shared and the documented
    # WinError 5 (antivirus scanning a just-written temp path) mitigation
    # below still applies per-file. Coverage instrumentation was removed
    # from this PR-tier run: the old `if: matrix.python-version == '3.11'`
    # upload condition could never be true against this job's 3.14 matrix,
    # so --cov=src --cov-report=xml ran on every PR for ~85 minutes and the
    # XML was silently discarded every time. Coverage now runs once a day
    # in nightly.yml against the full suite instead.
    #
    # --timeout=300 --timeout-method=thread: pytest-timeout was previously
    # fully removed ("pip uninstall -y pytest-timeout") after it "caused
    # silent crashes despite plugin installation attempts", which traded a
    # rare crash for a hang costing the entire job's time limit with zero
    # diagnostics. thread-method interrupts a stuck test without relying on
    # signals (unreliable on Windows) and still reports which test hung.
    - name: Run tests
      shell: bash
      run: |
        set +e
        pytest tests/ -m "not slow and not nightly" -n auto --dist loadfile --timeout=300 --timeout-method=thread --tb=short -q > /tmp/pytest_output.txt 2>&1
        PARALLEL_EXIT=$?
        cat /tmp/pytest_output.txt
        if [ "$PARALLEL_EXIT" -eq 0 ]; then
          exit 0
        fi
        echo "Parallel run failed or flaked -- retrying just the failures serially (matches CLAUDE.md's documented WinError 5 file-lock flake mitigation) before treating this as a real failure."
        pytest tests/ -m "not slow and not nightly" --lf --tb=short -q > /tmp/pytest_retry_output.txt 2>&1
        RETRY_EXIT=$?
        echo "--- serial retry of failures ---"
        cat /tmp/pytest_retry_output.txt
        exit $RETRY_EXIT

    - name: Verify frozen golden-master gate executed (F0.3)
      shell: bash
      run: |
        # Checks both output files: if the parallel run flaked on an
        # unrelated test and this one only reran in the serial --lf retry
        # above, its PASSED line lands in pytest_retry_output.txt instead.
        if grep -q "test_frozen_plan_dollar_figures_are_exact" /tmp/pytest_output.txt /tmp/pytest_retry_output.txt 2>/dev/null; then
          echo "✓ Frozen golden-master test executed and passed"
        else
          echo "✗ FAIL: Frozen golden-master test did not execute or was skipped"
          echo "  This is a mandatory gate. Check pytest output above."
          exit 1
        fi

    - name: Fail if the test suite mutated input/
      run: git diff --exit-code -- input/

  frontend-tests:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v6
      with:
        node-version: "22"

    # js_codemod_parser_offsets.test.mjs imports @babel/parser directly, so
    # this suite needs node_modules even though the other frontend tests are
    # dependency-free vm-sandbox tests.
    - name: Install Node dependencies
      run: npm ci

    - name: Frontend JS unit tests
      # node 22 (LTS) is required: `node --test` only gained glob-pattern
      # expansion in node 21, so on node 20 the pattern below is treated as a
      # literal path ("Could not find ...") and the job errors.
      run: node --test "tests/frontend/**/*.test.mjs"

  e2e-tests:
    # Separate job from frontend-tests (system review 2026-08-04, finding
    # `no-browser-execution-testing`): this drives a real Chromium browser
    # against the real app, which is a materially different failure mode
    # (and a much heavier one -- browser binary install, a real HTTP server,
    # real page loads) than the Node vm-sandbox unit tests above. Keeping it
    # a separate job means a flaky/slow browser run never blocks or muddies
    # the fast, deterministic frontend-tests signal.
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        # Aligned to the `test` job's 3.14 (was 3.11 here and in `build`
        # below) so the e2e suite exercises the same interpreter the
        # shipped executable is built on. 2026-09-15 CI-time profiling.
        python-version: '3.14'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Install Node dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install chromium

    - name: Run E2E suite
      run: npx playwright test

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

  build:
    runs-on: windows-latest
    # No longer `needs: [test]`: this is 2m24s of PyInstaller packaging with
    # no dependency on test output. It previously idled for the ~85 minutes
    # the `test` job ran, then added its own time on top of the critical
    # path. Runs in parallel now; `fast-gates` and `test` still gate the
    # merge via branch protection regardless of `build`'s own result.
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: |
        python build.py --no-backup

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: retirement-planner-exe
        path: dist/retirement_planner/
        retention-days: 30
      if: success()

    - name: Check build output
      run: |
        if (Test-Path dist/retirement_planner/retirement_planner.exe) {
          Write-Host "✓ Build successful: retirement_planner.exe created"
          Get-Item dist/retirement_planner/retirement_planner.exe | Select-Object FullName, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}}
        } else {
          Write-Error "✗ Build failed: retirement_planner.exe not found"
          exit 1
        }
