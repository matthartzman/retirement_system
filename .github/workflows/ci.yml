name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: '3.14'

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    # Several pytest tests shell out to the tools/js_codemod/*.mjs codemods
    # (tests/test_dashboard_codemod_census_report_regression.py,
    # test_dashboard_extract_module_tool.py,
    # test_dashboard_js_module_bridge_regression.py). Those scripts import
    # @babel/parser and jscodeshift, so without node_modules they die with
    # ERR_MODULE_NOT_FOUND and the tests report it as tool failure/drift.
    - uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Install Node dependencies
      run: npm ci

    - name: Remove pytest-timeout plugin
      run: |
        pip uninstall -y pytest-timeout || true

    - name: Lint with ruff
      run: |
        ruff check src/ tests/

    - name: Type check (mypy, informational — not yet a merge gate)
      run: mypy src/ --ignore-missing-imports || true

    - name: Run tests
      run: |
        pytest tests/ --tb=short -q --cov=src --cov-report=xml -v > /tmp/pytest_output.txt 2>&1 || TEST_EXIT=$?
        cat /tmp/pytest_output.txt
        exit ${TEST_EXIT:-0}

    - name: Verify frozen golden-master gate executed (F0.3)
      run: |
        if grep -q "test_frozen_plan_dollar_figures_are_exact PASSED\|test_frozen_plan_dollar_figures_are_exact" /tmp/pytest_output.txt; then
          echo "✓ Frozen golden-master test executed and passed"
        else
          echo "✗ FAIL: Frozen golden-master test did not execute or was skipped"
          echo "  This is a mandatory gate. Check pytest output above."
          exit 1
        fi

    - name: Fail if the test suite mutated input/
      run: git diff --exit-code -- input/

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      if: matrix.python-version == '3.11'
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  frontend-tests:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v6
      with:
        node-version: "22"

    # js_codemod_parser_offsets.test.mjs imports @babel/parser directly, so
    # this suite needs node_modules even though the other frontend tests are
    # dependency-free vm-sandbox tests.
    - name: Install Node dependencies
      run: npm ci

    - name: Frontend JS unit tests
      # node 22 (LTS) is required: `node --test` only gained glob-pattern
      # expansion in node 21, so on node 20 the pattern below is treated as a
      # literal path ("Could not find ...") and the job errors.
      run: node --test "tests/frontend/**/*.test.mjs"

  e2e-tests:
    # Separate job from frontend-tests (system review 2026-08-04, finding
    # `no-browser-execution-testing`): this drives a real Chromium browser
    # against the real app, which is a materially different failure mode
    # (and a much heavier one -- browser binary install, a real HTTP server,
    # real page loads) than the Node vm-sandbox unit tests above. Keeping it
    # a separate job means a flaky/slow browser run never blocks or muddies
    # the fast, deterministic frontend-tests signal.
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Install Node dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install chromium

    - name: Run E2E suite
      run: npx playwright test

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

  regression-checks:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run regression checks
      run: |
        python tools/run_regression.py

  build:
    runs-on: windows-latest
    needs: [test]
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable
      run: |
        python build.py --no-backup

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: retirement-planner-exe
        path: dist/retirement_planner/
        retention-days: 30
      if: success()

    - name: Check build output
      run: |
        if (Test-Path dist/retirement_planner/retirement_planner.exe) {
          Write-Host "✓ Build successful: retirement_planner.exe created"
          Get-Item dist/retirement_planner/retirement_planner.exe | Select-Object FullName, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}}
        } else {
          Write-Error "✗ Build failed: retirement_planner.exe not found"
          exit 1
        }
